    <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/>
  </g>
  <!-- Icon -->
  <g transform="translate(100, 220)">
    <circle cx="40" cy="40" r="36" stroke="#b8c4ff" stroke-width="3" fill="none" opacity="0.3"/>
    <path d="M20 40C20 28.95 28.95 20 40 20C51.05 20 60 28.95 60 40" stroke="#b8c4ff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M60 40C60 51.05 51.05 60 40 60C28.95 60 20 51.05 20 40" stroke="#4B66D1" stroke-width="3.5" stroke-linecap="round" fill="none"/>
