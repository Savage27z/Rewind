  <text x="100" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.5)">Every mutation captured. Scrub through time.</text>
  <text x="100" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.5)">Diff any two moments. Reconstruct state at any millisecond.</text>
